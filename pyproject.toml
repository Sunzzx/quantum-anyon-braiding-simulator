[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantum-anyon-braiding-simulator"
version = "0.1.0"
description = "Topological Quantum Computation and Non-Abelian Anyon Braiding Engine with Yang-Baxter & Pentagon Invariance Verification"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ayush Kandwal", email = "ayufrom03@gmail.com" }
]
dependencies = [
    "numpy>=1.24.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
anyon-braid = "anyon_braid.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anyon_braid"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
